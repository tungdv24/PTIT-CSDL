{% extends "base.html" %}
{% block title %}Xem CSDL{% endblock %}
{% block content %}
<div class="page-head">
  <h1>🗄️ Xem CSDL (QuanLyToaNha)</h1>
  <a class="btn" href="{{ url_for('dbviewer.run_query') }}">Chay truy van SQL</a>
</div>
<div class="card" style="padding:0;overflow:hidden;">
  <table>
    <thead><tr><th>Bang</th><th>So dong (uoc tinh)</th><th></th></tr></thead>
    <tbody>
      {% for t in tables %}
      <tr>
        <td><strong>{{ t.name }}</strong></td>
        <td>{{ t.approx_rows if t.approx_rows is not none else '—' }}</td>
        <td><a class="btn sm secondary" href="{{ url_for('dbviewer.browse', name=t.name) }}">Xem du lieu</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
