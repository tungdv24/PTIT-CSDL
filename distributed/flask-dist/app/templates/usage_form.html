{% extends "base.html" %}
{% block title %}Ghi nhận sử dụng{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Ghi nhận sử dụng dịch vụ</h1>
  <a class="btn secondary" href="{{ url_for('usage.list_view') }}">← Quay lại</a>
</div>
<div class="card" style="max-width:560px;">
  {% if is_self %}<div class="flash info">Bạn đang ghi sử dụng cho chính mình.</div>{% endif %}
  <form method="post" id="f">
    {% if not is_self %}
    <label>Nhân viên công ty <span style="color:#dc2626;">*</span></label>
    <select name="ma_nhan_vien" required>
      <option value="">-- Chọn nhân viên --</option>
      {% for nv in nhan_viens %}<option value="{{ nv.ma_nhan_vien }}">{{ nv.ho_ten }} ({{ nv.ma_so_nhan_vien }})</option>{% endfor %}
    </select>
    {% endif %}
    <label>Dịch vụ (theo lượt) <span style="color:#dc2626;">*</span></label>
    <select name="ma_dang_ky" id="dk" required>
      <option value="">-- Chọn dịch vụ --</option>
      {% for d in dks %}<option value="{{ d.ma_dang_ky }}" data-gia="{{ d.don_gia }}">{{ d.ten_dich_vu }} ({{ d.don_gia|money }} đ)</option>{% endfor %}
    </select>
    <label>Ngày sử dụng <span style="color:#dc2626;">*</span></label>
    <input type="date" name="ngay_su_dung" value="{{ today }}" required>
    <label>Số lượng <span style="color:#dc2626;">*</span></label>
    <input type="number" step="any" name="so_luong" value="1" required>
    <label>Đơn giá <span style="color:#dc2626;">*</span></label>
    <input type="number" step="any" name="don_gia" id="dg" required>
    <label>Ghi chú</label>
    <input type="text" name="ghi_chu" placeholder="VD: Suat an trua, Gui xe...">
    <div style="margin-top:20px;"><button class="btn">Ghi nhận</button></div>
  </form>
</div>
<script>
  document.getElementById('dk').addEventListener('change', function(){
    var g = this.options[this.selectedIndex].getAttribute('data-gia');
    if (g) document.getElementById('dg').value = g;
  });
</script>
{% endblock %}
